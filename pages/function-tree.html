<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜猫智店 · 功能菜单</title>
  <link rel="stylesheet" href="../shared/layout.css">
</head>
<body>
  <div class="toast" id="toast"></div>
  <div id="sidebarRoot"></div>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="main">
    <div id="headerRoot"></div>
    <div class="content">
    <!-- ========== PAGE: 功能菜单（对齐 Vue master system 域 functionTree） ========== -->
    <div class="page page-fill" id="page-function-tree">
      <div id="function-treeContent" style="display:flex;flex:1;min-height:0;overflow:hidden;background:#F1F2F5"></div>
    </div>
    </div>
  </div>
  <div id="modalRoot"></div>

  <script>var CURRENT_PAGE='function-tree';</script>
  <script src="../shared/sidebar.js"></script>
  <script src="../shared/header.js"></script>
  <script src="../shared/modals.js"></script>
  <script src="../shared/layout.js" data-page="function-tree"></script>
  <script src="../shared/ms-system.js"></script>
  <script>
    initMultiPage(CURRENT_PAGE);
    if (typeof initSystemPage === 'function') initSystemPage(CURRENT_PAGE);
    if (typeof initTicker === 'function') initTicker();
    (function() { var el = document.getElementById('updateTime'); if (el) el.textContent = '更新 2026-09-03'; })();
  </script>
</body>
</html>
