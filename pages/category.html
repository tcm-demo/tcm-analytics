  // ─── Build rank list HTML ───
  function buildRankList(rank, cats) {
    var h = '';
    for (var i = 0; i < rank.length; i++) {
      var r = rank[i];
      var cls = r.n <= 3 ? 'top3' : 'other';
      var chgCls = r.c.charAt(0) === '▲' ? 'up' : (r.c.charAt(0) === '▼' ? 'down' : '');
      h += '<div class="rank-item"><div class="rank-row">' +
        '<div class="rank-num ' + cls + '">' + r.n + '</div>' +
        '<span class="rank-name">' + cats[i] + '</span>' +
        '<span class="rank-value">' + r.s + '<span style="font-size:11px;color:#999">分</span></span>' +
        '<span class="rank-change' + (chgCls ? ' ' + chgCls : '') + '"' + (chgCls ? '' : ' style="color:#999"') + '>' + (r.c === '—' ? '—' : r.c) + '</span>' +
        '</div><div class="rank-bar-row"><div class="rank-bar"><div class="rank-bar-fill" style="width:' + r.w + '%"></div></div></div></div>';
    }
    return h;
  }

  // ─── Build table rows ───
  function buildTableRows(rows) {
    var h = '';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      h += '<tr><td>' + (i+1) + '</td><td style="font-weight:500">' + r[0] + '</td>' +
        '<td style="text-align:right">' + r[1] + '</td>' +
        '<td style="text-align:right">' + r[2] + '</td>' +
        '<td style="text-align:right">' + r[3] + '</td>' +
        '<td style="text-align:right">' + r[4] + '</td>' +
        '<td style="text-align:right;color:#fc4b52">' + r[5] + '</td>' +
        '<td style="text-align:right;color:#fc4b52">' + r[6] + '</td>' +
        '<td><span style="display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;background:' + r[8] + ';color:' + r[9] + '">' + r[7] + '</span></td></tr>';
    }
    return h;
  }

  // ─── Rebuild grouped bar chart (本期 vs 上期) ───
  function buildBarChart(d) {
    var mom = d.momData;
    var currData = mom.map(function(x) { return x.curr; });
    var prevData = mom.map(function(x) { return x.prev; });
    var maxVal = Math.max.apply(null, currData.concat(prevData));
    var n = d.cats.length;
    var cfg = n <= 3 ? { barPercentage: 0.45, categoryPercentage: 0.55, maxBarThickness: 28 }
            : n <= 6 ? { barPercentage: 0.55, categoryPercentage: 0.65, maxBarThickness: 32 }
            : { barPercentage: 0.65, categoryPercentage: 0.75, maxBarThickness: 36 };
    return makeChart('catBarChart', {
      type: 'bar',
      data: {
        labels: d.cats,
        datasets: [
          { label: d.momLabels[0], data: currData, backgroundColor: '#1088C3', borderRadius: 4, barPercentage: cfg.barPercentage, categoryPercentage: cfg.categoryPercentage, maxBarThickness: cfg.maxBarThickness },
          { label: d.momLabels[1], data: prevData, backgroundColor: '#c8d6e5', borderRadius: 4, barPercentage: cfg.barPercentage, categoryPercentage: cfg.categoryPercentage, maxBarThickness: cfg.maxBarThickness }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 8, padding: 12, font: { size: 11 } } }, datalabels: { display: false } },
        scales: {
          x: { grid: { display: false } },
          y: {
            grid: { color: '#f5f5f5' },
            ticks: {
              callback: function(v) {
                if (maxVal < 10000) return '¥' + v.toLocaleString();
                return '¥' + v + '万';
              }
            }
          }
        }
      }
    });
  }

  // ─── Rebuild radar chart ───
  function buildRadarChart(d) {
    return makeChart('catRadarChart', {
      type: 'radar',
      data: {
        labels: d.cats,
        datasets: [
          { label: '营业额指数', data: d.radarData[0], borderColor: '#1088C3', backgroundColor: 'rgba(16,136,195,0.1)', borderWidth: 2, pointRadius: 3 },
          { label: '毛利指数', data: d.radarData[1], borderColor: '#3EB27E', backgroundColor: 'rgba(62,178,126,0.1)', borderWidth: 2, pointRadius: 3 },
          { label: '订单量指数', data: d.radarData[2], borderColor: '#FFB86C', backgroundColor: 'rgba(255,184,108,0.1)', borderWidth: 2, pointRadius: 3 }
        ]
      },
      options: {
        responsive: true,
        scales: { r: { min: 0, max: 100, grid: { color: '#e0e0e0' } } }
      }
    });
  }

  // ─── Build insight summary ───
  function buildInsight(d) {
    var growth = d.momData.map(function(x, i) {
      return { name: d.cats[i], rate: x.prev === 0 ? 0 : (x.curr - x.prev) / x.prev * 100 };
    });
    growth.sort(function(a, b) { return b.rate - a.rate; });
    var top = growth[0];
    var bottom = growth[growth.length - 1];

    var topRank = d.rank.slice().sort(function(a, b) { return parseFloat(b.s) - parseFloat(a.s); })[0];
    var topRankName = d.cats[topRank.n - 1];

    var topMargin = d.tableRows.slice().sort(function(a, b) { return parseFloat(b[4]) - parseFloat(a[4]); })[0];

    var fmt = function(v) { return (v > 0 ? '▲ ' : (v < 0 ? '▼ ' : '')) + Math.abs(v).toFixed(1) + '%'; };
    return '<div class="insight-row" style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0">' +
        '<div><div style="font-size:12px;color:#999">增长最快</div><div style="font-size:13px;font-weight:500;margin-top:2px">' + top.name + '</div></div>' +
        '<div style="font-size:15px;font-weight:600;color:' + (top.rate >= 0 ? '#2e7d32' : '#ec2d30') + '">' + fmt(top.rate) + '</div></div>' +
      '<div class="insight-row" style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0">' +
        '<div><div style="font-size:12px;color:#999">下降最多</div><div style="font-size:13px;font-weight:500;margin-top:2px">' + bottom.name + '</div></div>' +
        '<div style="font-size:15px;font-weight:600;color:' + (bottom.rate >= 0 ? '#2e7d32' : '#ec2d30') + '">' + fmt(bottom.rate) + '</div></div>' +
      '<div class="insight-row" style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0">' +
        '<div><div style="font-size:12px;color:#999">综合得分最高</div><div style="font-size:13px;font-weight:500;margin-top:2px">' + topRankName + '</div></div>' +
        '<div style="font-size:15px;font-weight:600;color:#005cf5">' + topRank.s + '<span style="font-size:11px;color:#999">分</span></div></div>' +
      '<div class="insight-row" style="display:flex;justify-content:space-between;align-items:center;padding:10px 0">' +
        '<div><div style="font-size:12px;color:#999">毛利率最高</div><div style="font-size:13px;font-weight:500;margin-top:2px">' + topMargin[0] + '</div></div>' +
        '<div style="font-size:15px;font-weight:600;color:#005cf5">' + topMargin[4] + '</div></div>';
  }

  // ─── Switch view ───
  function switchCatView(view) {
    var scopeMap = { today: 'day', week: 'week', month: 'month', year: 'year', day: 'day' };
    var d = CAT_SCOPE[scopeMap[view] || view];
    if (!d) return;

    // KPI
    for (var i = 0; i < 4; i++) {
      var lbl = document.getElementById('kpiCLabel' + i);
      var val = document.getElementById('kpiCVal' + i);
      var chg = document.getElementById('kpiCChg' + i);
      if (lbl) lbl.textContent = d.kpiLabels[i];
      if (val) {
        var vv = d.kpiVals[i];
        val.innerHTML = '<span>' + vv[0] + '</span>' + vv[1] + (vv[2] ? '<span>' + vv[2] + '</span>' : '');
      }
      if (chg) chg.textContent = d.kpiChgs[i];
    }

    // Subtitles
    ['barSub','radarSub','rankSub','insightSub','tableSub'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.textContent = d[id];
    });

    // Charts
    buildBarChart(d);
    buildRadarChart(d);

    // Rank list
    var rl = document.getElementById('catRankList');
    if (rl) rl.innerHTML = buildRankList(d.rank, d.cats);

    // Insight
    var iw = document.getElementById('catInsightWrap');
    if (iw) iw.innerHTML = buildInsight(d);

    // Table
    var tb = document.getElementById('catTableBody');
    if (tb) tb.innerHTML = buildTableRows(d.tableRows);
  }

  // Override global initCategory so the page responds to the global scope bar
  window.initCategory = function() {
    switchCatView(currentRange);
  };

  // Initialize on load using the global currentRange
  (function() {
    switchCatView(currentRange);
  })();
</script>
</body>
</html>
