<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>菜猫智店 · 鲜生活，智经营</title>
<meta http-equiv="refresh" content="8;url=pages/overview.html">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    display: flex; align-items: center; justify-content: center; 
    height: 100vh; background: #0B121C; color: #fff; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  }

  /* ===== 背景粒子 ===== */
  #particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .particle {
    position: absolute; font-size: 20px; opacity: 0;
    animation: floatUp 7s ease-in infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(105vh) translateX(0)    scale(0.5) rotate(0deg);   opacity: 0; }
    8%   { opacity: 0.5; }
    15%  { transform: translateY(80vh)  translateX(30px)  scale(0.8) rotate(8deg);   opacity: 0.45; }
    40%  { transform: translateY(40vh)  translateX(-20px) scale(1.05) rotate(-5deg); opacity: 0.35; }
    70%  { transform: translateY(15vh)  translateX(15px)  scale(0.9) rotate(12deg);  opacity: 0.2; }
    100% { transform: translateY(-8vh)  translateX(0)     scale(0.6) rotate(20deg);  opacity: 0; }
  }

  /* ===== 光晕 ===== */
  .glow {
    position: fixed; border-radius: 50%; filter: blur(100px); z-index: 0;
    animation: glowBreathe 4s ease-in-out infinite;
  }
  .glow-1 { width: 400px; height: 400px; background: #00C853; top: -150px; right: -80px; opacity: 0.18; animation-delay: 0s; }
  .glow-2 { width: 350px; height: 350px; background: #005CF5; bottom: -120px; left: -80px; opacity: 0.16; animation-delay: 2s; }
  .glow-3 { width: 200px; height: 200px; background: #69F0AE; top: 40%; left: 60%; opacity: 0.08; animation-delay: 1s; }
  @keyframes glowBreathe {
    0%, 100% { transform: scale(1); opacity: 0.16; }
    50%      { transform: scale(1.2); opacity: 0.24; }
  }

  /* ===== 内容区 ===== */
  .entry {
    position: relative; z-index: 1; text-align: center;
    animation: fadeIn 0.8s ease-out both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo-icon {
    display: inline-block; font-size: 72px; margin-bottom: 10px;
    animation: logoBounce 1s cubic-bezier(.34,1.56,.64,1) both, logoFloat 3s ease-in-out 1.2s infinite;
  }
  @keyframes logoBounce {
    from { opacity: 0; transform: scale(0.2) rotate(-15deg); }
    to   { opacity: 1; transform: scale(1) rotate(0deg); }
  }
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  .entry h1 { 
    font-size: 34px; font-weight: 500; margin-bottom: 4px;
    letter-spacing: 3px;
    text-shadow: 0 0 60px rgba(255,255,255,0.15);
    animation: fadeIn 0.8s 0.15s ease-out both;
  }
  .entry h1 .brand { 
    background: linear-gradient(135deg, #00E676, #69F0AE, #00C853);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
    filter: drop-shadow(0 0 18px rgba(0,200,83,0.5));
  }

  .entry .slogan { 
    color: #99aabb; font-size: 16px; margin-bottom: 4px;
    letter-spacing: 6px;
    animation: fadeIn 0.8s 0.3s ease-out both;
  }

  .divider {
    display: block; width: 50px; height: 2px; 
    background: linear-gradient(90deg, transparent, #00C853, #00E676, #00C853, transparent);
    margin: 14px auto;
    animation: expandLine 1s ease-out both;
  }
  @keyframes expandLine {
    from { width: 0; opacity: 0; }
    to   { width: 50px; opacity: 1; }
  }

  .sub { 
    color: #667788; font-size: 13px; margin-bottom: 32px;
    animation: fadeIn 0.8s 0.45s ease-out both;
  }

  /* ===== 倒计时 ===== */
  .countdown { 
    margin-top: 0; color: #445566; font-size: 13px; 
    animation: fadeIn 1s 0.9s ease-out both;
  }

  /* 倒计时数字闪烁 */
  .countdown .sec { color: #00C853; font-weight: 600; }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <div id="particles"></div>

  <div class="entry">
    <span class="logo-icon">🥬</span>
    <h1>淘菜猫<span class="brand">|智店</span></h1>
    <p class="slogan">鲜生活，智经营</p>
    <span class="divider"></span>
    <p class="sub">社区生鲜数智化经营平台</p>
    <p class="countdown"><span class="sec" id="sec">3</span> 秒后自动跳转…</p>
  </div>

  <script>
    // 背景漂浮食材粒子
    (function() {
      var icons = ['🥬','🍅','🥕','🌽','🥒','🧄','🍄','🥩','🦐','🥚','🍎','🍊','🍇','🥝','🐟','🧅','🥦','🫑','🍠','🍋'];
      var container = document.getElementById('particles');
      for (var i = 0; i < 28; i++) {
        var span = document.createElement('span');
        span.className = 'particle';
        span.textContent = icons[i % icons.length];
        span.style.left = (2 + Math.random() * 96) + '%';
        span.style.animationDelay = Math.random() * 7 + 's';
        span.style.animationDuration = (6 + Math.random() * 6) + 's';
        span.style.fontSize = (20 + Math.random() * 28) + 'px';
        container.appendChild(span);
      }
    })();

    // 倒计时
    var sec = 7;
    var el = document.getElementById('sec');
    setInterval(function() {
      if (sec > 1) { sec--; el.textContent = sec; }
    }, 1000);

    setTimeout(function(){ location.href = 'pages/overview.html'; }, 7500);
  </script>
</body>
</html>
