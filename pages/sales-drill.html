<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜猫智店 · 下钻明细</title>
  <link rel="stylesheet" href="../shared/layout.css">
</head>
<body>
  <div class="toast" id="toast"></div>
  <div id="sidebarRoot"></div>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="main">
    <div id="headerRoot"></div>
    <div class="content">
    <!-- ========== PAGE: 下钻明细（销售报表二级页 · 分类/供应商下钻后的商品明细） ==========
         不进导航；仅由销售报表「分类」「供应商」维度点名称 → srOpenDrill() 跨页带参进入。
         维度固定为商品，数据范围锁定被点的那个分类 / 供应商；
         门店 / 时间周期 / 时间粒度在二级页内可继续调整（不回写来源页）。
         「← 返回销售报表」按进入前的上下文原样还原来源页。 -->
    <div class="page page-fill" id="page-sales-drill">
      <div id="salesDrillContent" style="display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;background:#F1F2F5"></div>
    </div>
    </div>
  </div>
  <div id="modalRoot"></div>

  <script>var CURRENT_PAGE='sales-drill';</script>
  <script src="../shared/sidebar.js"></script>
  <script src="../shared/header.js"></script>
  <script src="../shared/build-info.js"></script>
  <script src="../shared/modals.js"></script>
  <script src="../shared/layout.js" data-page="sales-drill"></script>
  <script src="../shared/ms-goods.js"></script>
  <script src="../shared/ms-sales.js"></script>
  <script>
    initMultiPage(CURRENT_PAGE);
  </script>
</body>
</html>
