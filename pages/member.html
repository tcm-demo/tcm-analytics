<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜猫智店 · 会员分析</title>
  <link rel="stylesheet" href="../shared/layout.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body>
  <div class="toast" id="toast"></div>
  <div id="sidebarRoot"></div>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="main">
    <div id="headerRoot"></div>
    <div class="content">
    <!-- ========== PAGE: 会员分析 ========== -->
    <div class="page" id="page-member">
      <div class="kpi-grid">
        <div class="kpi-card" style="--card-color:#F0F6FF">
          <div class="kpi-label">总会员数</div>
          <div class="kpi-value">2,847<span>人</span></div>
          <div class="kpi-change up">▲ 本月新增 138</div>
          <div class="kpi-icon">👥</div>
        </div>
        <div class="kpi-card" style="--card-color:#e3f2fd">
          <div class="kpi-label">活跃会员</div>
          <div class="kpi-value">1,203<span>人</span></div>
          <div class="kpi-change up">▲ 活跃率 42.3%</div>
          <div class="kpi-icon">🔥</div>
        </div>
        <div class="kpi-card" style="--card-color:#fff3e0">
          <div class="kpi-label">会员消费占比</div>
          <div class="kpi-value">68.5<span>%</span></div>
          <div class="kpi-change up">▲ 3.2% 提升</div>
          <div class="kpi-icon">💳</div>
        </div>
        <div class="kpi-card" style="--card-color:#f3e5f5">
          <div class="kpi-label">会员客单价</div>
          <div class="kpi-value"><span>¥</span>96.3</div>
          <div class="kpi-change up">▲ 较非会员+18%</div>
          <div class="kpi-icon">⭐</div>
        </div>
      </div>

      <div class="chart-grid-2">
        <div class="chart-card">
          <div class="chart-header">
            <div class="chart-title">会员增长趋势</div>
          </div>
          <div class="chart-wrap"><canvas id="memberGrowthChart" height="220"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-header">
            <div class="chart-title">会员等级分布</div>
          </div>
          <div class="chart-wrap"><canvas id="memberLevelChart" height="220"></canvas></div>
        </div>
      </div>

      <div class="chart-grid-2-eq">
        <div class="chart-card">
          <div class="chart-header">
            <div class="chart-title">会员消费频次分布</div>
          </div>
          <div class="chart-wrap"><canvas id="memberFreqChart" height="180"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-header">
            <div class="chart-title">RFM 客户价值分析</div>
            <div class="chart-sub">近度 / 频次 / 金额</div>
          </div>
          <div id="rfmGrid"></div>
        </div>
      </div>
    </div>
    </div>
  </div>
  <div id="modalRoot"></div>

  <script>var CURRENT_PAGE='member';</script>
  <script src="../shared/sidebar.js"></script>
  <script src="../shared/header.js"></script>
  <script src="../shared/modals.js"></script>
  <script src="../shared/layout.js" data-page="member"></script>
  <script>
    initMultiPage(CURRENT_PAGE);
    if (typeof initTicker === 'function') initTicker();
    (function() { var el = document.getElementById('updateTime'); if (el) el.textContent = '更新 2026-07-01 23:05'; })();
  </script>
</body>
</html>
