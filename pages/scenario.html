    <button type="button" class="fv-skip" id="fvSkip" data-page-node-id="bJYJoBOhg6BOTjS3UcfeTr">跳过，立即进入</button>
  </div>
  <script>
    /* ===== FIRST-VIEW OVERLAY（首次打开应用场景一览引导） ===== */
    (function () {
      var KEY = 'tcm_firstview_scenario_v1';
      function readSeen() { try { return !!window.localStorage.getItem(KEY); } catch (e) { return false; } }
      function markSeen() { try { window.localStorage.setItem(KEY, '1'); } catch (e) {} }
      // 解析 URL 参数
      var params = {};
      (window.location.search || '').replace(/[?&]([^=&#]+)=?([^&#]*)/g, function (_, k, v) {
        params[decodeURIComponent(k)] = decodeURIComponent(v || '');
      });
      var first = params.first === '1';
      // back 仅接受同目录相对页名（如 overview.html 或带查询串），防 /、..、scheme 注入
      var back = (params.back || 'overview.html')
        .replace(/[^A-Za-z0-9._?=&%-]/g, '')
        .replace(/\.\.+/g, '.')
        .slice(0, 200) || 'overview.html';
      if (!first) {
        // 用户主动进入本页（非系统引导）：视为已看过，仅打标记
        markSeen();
        return;
      }
      if (readSeen()) { window.location.replace(back); return; } // 已看过却带 first 参数（陈旧标签页），直接回目标页
      // ---- 首次引导：倒计时 20s 自动切回 back；点击条/按钮立即跳过 ----
      var bar = document.getElementById('fvBar');
      if (!bar) { markSeen(); window.location.replace(back); return; }
      var secEl = document.getElementById('fvSec');
      var remain = 20;
      if (secEl) secEl.textContent = remain;
      bar.hidden = false;
      var finished = false;
      function finish() {
        if (finished) return;
        finished = true;
        bar.hidden = true;
        markSeen();
        window.location.replace(back);
      }
      bar.addEventListener('click', finish);
      var skipBtn = document.getElementById('fvSkip');
      if (skipBtn) skipBtn.addEventListener('click', function (ev) { ev.stopPropagation(); finish(); });
      var timer = setInterval(function () {
        remain--;
        if (remain <= 0) { clearInterval(timer); finish(); return; }
        if (secEl) secEl.textContent = remain;
      }, 1000);
      // 导览中经其他入口离开（侧栏导航等）：同样记为已看过
      window.addEventListener('beforeunload', markSeen);
    })();
  </script>
