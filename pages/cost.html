<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜猫智店 · 成本管控</title>
  <link rel="stylesheet" href="../shared/layout.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body>
  <div class="toast" id="toast"></div>
  <div id="sidebarRoot"></div>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="main">
    <div id="headerRoot"></div>
    <div class="content">
    <!-- ========== PAGE: 成本管控 ========== -->
    <div class="page" id="page-cost">
      <div class="kpi-grid">
        <div class="kpi-card" style="--card-color:#fce4ec">
          <div class="kpi-label">本月采购成本</div>
          <div class="kpi-value"><span>¥</span>20.0<span>万</span></div>
          <div class="kpi-change down">▲ 5.2% 成本上升</div>
          <div class="kpi-icon">🧾</div>
        </div>
        <div class="kpi-card" style="--card-color:#fff3e0">
          <div class="kpi-label">损耗金额</div>
          <div class="kpi-value"><span>¥</span>1.42<span>万</span></div>
          <div class="kpi-change down">▲ 损耗率 7.1%</div>
          <div class="kpi-icon">📉</div>
        </div>
        <div class="kpi-card" style="--card-color:#e3f2fd">
          <div class="kpi-label">人力成本</div>
          <div class="kpi-value"><span>¥</span>2.8<span>万</span></div>
          <div class="kpi-change up">— 基本持平</div>
          <div class="kpi-icon">👤</div>
        </div>
        <div class="kpi-card" style="--card-color:#F0F6FF">
          <div class="kpi-label">运营费用</div>
          <div class="kpi-value"><span>¥</span>1.5<span>万</span></div>
          <div class="kpi-change down">▲ 较上月 +3%</div>
          <div class="kpi-icon">🏭</div>
        </div>
      </div>

      <div class="chart-grid-2">
        <div class="chart-card">
          <div class="chart-header">
            <div class="chart-title">成本构成分析</div>
          </div>
          <div class="chart-wrap"><canvas id="costPieChart" height="220"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-header">
            <div class="chart-title">月度成本趋势</div>
          </div>
          <div class="chart-wrap"><canvas id="costTrendChart" height="220"></canvas></div>
        </div>
      </div>

      <div class="chart-card" style="margin-bottom:8px">
        <div class="chart-header">
          <div class="chart-title">品类损耗率分析</div>
          <div class="chart-sub">红色预警：损耗率 > 10%</div>
        </div>
        <div id="lossRateList"></div>
      </div>
    </div>
    </div>
  </div>
  <div id="modalRoot"></div>

  <script>var CURRENT_PAGE='cost';</script>
  <script src="../shared/sidebar.js"></script>
  <script src="../shared/header.js"></script>
  <script src="../shared/modals.js"></script>
  <script src="../shared/layout.js" data-page="cost"></script>
  <script>
    initMultiPage(CURRENT_PAGE);
    if (typeof initTicker === 'function') initTicker();
    (function() { var el = document.getElementById('updateTime'); if (el) el.textContent = '更新 2026-07-01 23:05'; })();
  </script>
</body>
</html>
