<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜猫智店 · 库存预警</title>
  <link rel="stylesheet" href="../shared/layout.css">
  <script src="../shared/vendor/chart.umd.min.js"></script>
  <script src="../shared/vendor/chartjs-plugin-datalabels.min.js"></script>
</head>
<body>
  <div class="toast" id="toast"></div>
  <div id="sidebarRoot"></div>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="main">
    <div id="headerRoot"></div>
    <div class="content">
    <!-- ========== PAGE: 库存预警（数据驱动：ms-inventory.js 实时计算） ========== -->
    <div class="page" id="page-inventory">
      <div class="kpi-grid" id="invAlertKpis" style="gap:12px;margin-bottom:12px"></div>

      <div class="alert-strip warning" id="invAlertStrip" style="display:none"></div>

      <div class="chart-grid-2" style="gap:12px;margin-bottom:12px">
        <div class="chart-card" style="height:330px">
          <div class="chart-header">
            <div class="chart-title" id="invTurnTitle">各品类库存金额（成本）</div>
            <span style="font-size:11px;color:#8a93a3">Σ 批次库存 × 进货成本</span>
          </div>
          <div class="chart-wrap"><canvas id="invTurnChart"></canvas></div>
        </div>
        <div class="chart-card" style="height:330px">
          <div class="chart-header">
            <div class="chart-title" id="invLevelTitle">库存水位分布（按安全库存比率）</div>
          </div>
          <div class="chart-wrap"><canvas id="invLevelChart"></canvas></div>
        </div>
      </div>

      <div class="chart-card" style="margin-bottom:12px;padding:0;overflow:hidden">
        <div id="invAlertTables"></div>
      </div>
    </div>
    </div>
  </div>
  <div id="modalRoot"></div>

  <script>var CURRENT_PAGE='inventory';</script>
  <script src="../shared/sidebar.js"></script>
  <script src="../shared/header.js"></script>
  <script src="../shared/build-info.js"></script>
  <script src="../shared/modals.js"></script>
  <script src="../shared/ms-inventory.js"></script>
  <script src="../shared/layout.js" data-page="inventory"></script>
  <script>
    initMultiPage(CURRENT_PAGE);
  </script>
</body>
</html>
