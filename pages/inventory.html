<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜猫智店 · 库存预警</title>
  <link rel="stylesheet" href="../shared/layout.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body>
  <div class="toast" id="toast"></div>
  <div id="sidebarRoot"></div>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="main">
    <div id="headerRoot"></div>
    <div class="content">
    <!-- ========== PAGE: 库存预警 ========== -->
    <div class="page" id="page-inventory">
      <div class="kpi-grid">
        <div class="kpi-card" style="--card-color:#fce4ec">
          <div class="kpi-label">低库存预警</div>
          <div class="kpi-value">12<span>个</span></div>
          <div class="kpi-change down">⚠️ 需立即补货</div>
          <div class="kpi-icon">🚨</div>
        </div>
        <div class="kpi-card" style="--card-color:#fff3e0">
          <div class="kpi-label">临期商品</div>
          <div class="kpi-value">8<span>个</span></div>
          <div class="kpi-change down">⚠️ 需促销处理</div>
          <div class="kpi-icon">⏰</div>
        </div>
        <div class="kpi-card" style="--card-color:#F0F6FF">
          <div class="kpi-label">库存总值</div>
          <div class="kpi-value"><span>¥</span>4.2<span>万</span></div>
          <div class="kpi-change up">— 正常水位</div>
          <div class="kpi-icon">📦</div>
        </div>
        <div class="kpi-card" style="--card-color:#e3f2fd">
          <div class="kpi-label">今日建议补货</div>
          <div class="kpi-value">15<span>单</span></div>
          <div class="kpi-change up">📋 AI 自动生成</div>
          <div class="kpi-icon">🤖</div>
        </div>
      </div>

      <div class="alert-strip warning">⚠️ 土豆（库存仅剩 8kg）、鸡蛋（库存仅剩 50个）、猪肉（库存仅剩 3kg）库存已低于安全线，建议今日补货！</div>

      <div class="chart-grid-2">
        <div class="chart-card">
          <div class="chart-header">
            <div class="chart-title">库存周转率（各品类）</div>
          </div>
          <div class="chart-wrap"><canvas id="invTurnChart" height="220"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-header">
            <div class="chart-title">库存水位分布</div>
          </div>
          <div class="chart-wrap"><canvas id="invLevelChart" height="220"></canvas></div>
        </div>
      </div>

      <div class="chart-card" style="margin-bottom:8px">
        <div class="chart-header"><div class="chart-title">重点商品库存预警详情</div></div>
        <div class="table-wrap">
          <table id="invTable">
            <thead><tr><th>商品名称</th><th>品类</th><th>当前库存</th><th>安全库存</th><th>日均销量</th><th>预计售完</th><th>状态</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
    </div>
  </div>
  <div id="modalRoot"></div>

  <script>var CURRENT_PAGE='inventory';</script>
  <script src="../shared/sidebar.js"></script>
  <script src="../shared/header.js"></script>
  <script src="../shared/modals.js"></script>
  <script src="../shared/layout.js" data-page="inventory"></script>
  <script>
    initMultiPage(CURRENT_PAGE);
    if (typeof initTicker === 'function') initTicker();
    (function() { var el = document.getElementById('updateTime'); if (el) el.textContent = '更新 2026-07-01 23:05'; })();
  </script>
</body>
</html>
